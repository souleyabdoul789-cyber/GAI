name: Construire l'APK debug GAI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-gai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-debug:
    name: APK Android (offline-first)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.11.1 et mettre en cache les dépendances
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Installer les plateformes Android nécessaires
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Intégrer le modèle Vosk français dans les assets de l'APK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip"
          ARCHIVE="$RUNNER_TEMP/vosk-model-small-fr-0.22.zip"
          DOSSIER="$RUNNER_TEMP/vosk-modele-fr"
          mkdir -p "$DOSSIER" app/src/main/assets/model
          curl --fail --location --retry 4 --retry-delay 2 "$URL" --output "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$DOSSIER"
          cp -a "$DOSSIER/vosk-model-small-fr-0.22/." app/src/main/assets/model/
          test -f app/src/main/assets/model/am/final.mdl
          echo "Modèle intégré : $(du -sh app/src/main/assets/model | cut -f1)"

      - name: Compiler l'APK debug
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: GAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
